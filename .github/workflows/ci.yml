name: CI

on:
  push:
    branches: [ 'main' ]  # Run on main branch pushes
  pull_request:
    branches: [ 'main' ]  # Run on PRs targeting main
  workflow_dispatch:  # Allow manual triggering

jobs:
  detect-code-changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/**'
            demo:
              - 'Demo/**'
              - 'Sources/**'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/**'

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    needs: detect-code-changes
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests with coverage
        run: swift test -v --enable-code-coverage

      - name: Report code coverage
        run: |
          CODECOV_PATH=$(swift test --show-codecov-path)
          python3 -c "
          import json, sys
          with open('$CODECOV_PATH') as f:
              data = json.load(f)
          covered = 0
          total = 0
          for file_data in data['data'][0]['files']:
              name = file_data['filename']
              if '/Sources/SpecificationConfig/' not in name:
                  continue
              covered += file_data['summary']['lines']['covered']
              total += file_data['summary']['lines']['count']
          if total == 0:
              print('No source files found for coverage')
              sys.exit(1)
          pct = (covered / total) * 100
          print(f'SpecificationConfig coverage: {pct:.1f}% ({covered}/{total} lines)')
          if pct < 80:
              print(f'Coverage {pct:.1f}% is below 80% threshold')
              sys.exit(1)
          print('Coverage threshold passed')
          "

      - name: Run Thread Sanitizer
        run: swift test --sanitize=thread

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    needs: detect-code-changes
    container:
      image: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  lint:
    name: SwiftFormat Check
    runs-on: macos-latest
    needs: detect-code-changes
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting
        run: swiftformat --lint .

  build-release:
    name: Build Release Configuration
    runs-on: macos-latest
    needs: detect-code-changes
    if: github.event_name != 'pull_request' || needs.detect-code-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Build Release
        run: swift build -c release

  build-demo-app:
    name: Build Demo App
    runs-on: macos-latest
    needs: detect-code-changes
    if: github.event_name != 'pull_request' || needs.detect-code-changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Determine Tuist CLI release
        id: tuist-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${GITHUB_TOKEN:-}"
          AUTH_HEADER=""
          if [ -n "${TOKEN}" ]; then
            AUTH_HEADER="Authorization: Bearer ${TOKEN}"
            export AUTH_HEADER
          fi
          python3 .github/scripts/get-tuist-version.py

      - name: Cache Tuist binary
        id: cache-tuist
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tuist/${{ steps.tuist-version.outputs.tuist_version }}
          key: ${{ runner.os }}-tuist-${{ steps.tuist-version.outputs.tuist_version }}

      - name: Install Tuist
        env:
          TUIST_VERSION: ${{ steps.tuist-version.outputs.tuist_version }}
        run: |
          set -euo pipefail
          INSTALL_DIR="${RUNNER_TEMP}/tuist/${TUIST_VERSION}"
          mkdir -p "${INSTALL_DIR}"
          if [ ! -x "${INSTALL_DIR}/tuist" ]; then
            echo "Downloading Tuist ${TUIST_VERSION}"
            tmpdir=$(mktemp -d)
            curl -fL -o "${tmpdir}/tuist.zip" "https://github.com/tuist/tuist/releases/download/${TUIST_VERSION}/tuist.zip"
            unzip -q "${tmpdir}/tuist.zip" -d "${tmpdir}"
            rsync -a "${tmpdir}/" "${INSTALL_DIR}/"
            chmod +x "${INSTALL_DIR}/tuist"
            rm -rf "${tmpdir}"
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      - name: Show Tuist version
        run: tuist version

      - name: Install Demo Dependencies
        working-directory: Demo/ConfigPetApp
        run: tuist install

      - name: Generate Demo Project
        working-directory: Demo/ConfigPetApp
        run: tuist generate --no-open

      - name: Build Demo App
        working-directory: Demo/ConfigPetApp
        run: tuist xcodebuild build -scheme ConfigPetApp -workspace ConfigPetApp.xcworkspace
